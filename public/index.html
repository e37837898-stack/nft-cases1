<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кейсы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0a0a0f 70%); color: #e2e2e2; min-height: 100vh; padding: 20px; }
  #authScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
  .auth-box { background: rgba(26, 26, 46, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; padding: 40px; width: 100%; max-width: 420px; }
  .auth-box h1 { font-size: 32px; text-align: center; color: #a855f7; margin-bottom: 10px; }
  .auth-box .subtitle { color: #888; font-size: 14px; text-align: center; margin-bottom: 25px; }
  .tabs { display: flex; background: #12121a; border-radius: 12px; padding: 4px; margin-bottom: 25px; }
  .tab { flex: 1; padding: 12px; text-align: center; border-radius: 8px; cursor: pointer; font-weight: 600; color: #888; }
  .tab.active { background: #1a1a2e; color: #fff; }
  .input-group { margin-bottom: 18px; }
  .input-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #aaa; }
  .input-group input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #2a2a4a; background: #12121a; color: #fff; font-size: 15px; outline: none; }
  .btn-main { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(90deg, #a855f7, #ec4899); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
  #mainScreen { display: none; max-width: 1000px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; background: rgba(26, 26, 46, 0.8); padding: 15px 25px; border-radius: 16px; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.05); }
  .logo { font-size: 24px; font-weight: 800; color: #a855f7; }
  .user-info { font-weight: 600; color: #ccc; }
  .balance-top { background: #12121a; padding: 8px 16px; border-radius: 20px; border: 1px solid #2a2a4a; font-weight: bold; color: #ffd700; }
  .tabs-nav { display: flex; gap: 10px; margin-bottom: 25px; }
  .nav-btn { padding: 12px 24px; background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; color: #888; cursor: pointer; font-weight: 600; transition: 0.2s; }
  .nav-btn:hover { color: #fff; border-color: #a855f7; }
  .nav-btn.active { background: #a855f7; border-color: #a855f7; color: #fff; }
  .content-section { display: none; animation: fadeIn 0.3s; }
  .content-section.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .case { background: #16162a; border: 1px solid #2a2a4a; border-radius: 16px; padding: 25px 20px; text-align: center; cursor: pointer; transition: 0.3s; }
  .case:hover { transform: translateY(-5px); border-color: #a855f7; box-shadow: 0 10px 30px rgba(168, 85, 247, 0.15); }
  .case .icon { font-size: 50px; margin-bottom: 15px; }
  .case .name { font-weight: 700; font-size: 18px; color: #fff; margin-bottom: 5px; }
  .case .price { color: #ffd700; font-size: 15px; font-weight: bold; }
  .case .desc { color: #888; font-size: 12px; margin-top: 10px; }
  .inventory { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
  .item { background: #16162a; border: 1px solid #2a2a4a; border-radius: 14px; padding: 15px; text-align: center; }
  .item .icon { font-size: 40px; }
  .item .name { font-size: 14px; font-weight: 600; color: #fff; margin: 5px 0; }
  .item button { width: 100%; padding: 8px; border: none; border-radius: 8px; background: #f59e0b; color: #fff; cursor: pointer; margin-top: 5px; font-weight: bold; }
  .rarity-common { color: #9ca3af; }
  .rarity-nft { color: #10b981; } 
  .rarity-rare { color: #3b82f6; }
  .rarity-legendary { color: #f59e0b; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal.show { display: flex; }
  .modal .box { background: #16162a; border: 1px solid #2a2a4a; border-radius: 20px; padding: 30px; text-align: center; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
  .modal .box .icon { font-size: 80px; margin: 15px 0; }
  .modal .box .result-name { font-size: 22px; font-weight: bold; margin: 10px 0; color: #fff; }
  .modal .box button { margin-top: 20px; padding: 14px; width: 100%; background: #a855f7; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; }
  .modal .box .close-btn { background: transparent; border: 1px solid #2a2a4a; color: #888; margin-top: 10px; }
  .case-items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; text-align: left; }
  .case-item-preview { background: #0a0a0f; border: 1px solid #2a2a4a; border-radius: 10px; padding: 10px; text-align: center; }
  .case-item-preview .c-icon { font-size: 28px; }
  .case-item-preview .c-name { font-size: 12px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ccc; }
  .case-item-preview .c-rarity { font-size: 10px; font-weight: bold; margin-top: 4px; }
  .admin-box { background: #16162a; padding: 20px; border-radius: 16px; max-width: 400px; margin: 20px auto; text-align: left; }
  .admin-box input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: none; background: #0a0a0f; color: #fff; }
  .admin-box button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="authScreen">
  <div class="auth-box">
    <h1>Кейсы</h1>
    <div class="subtitle">Вход или регистрация. Бонус новичкам: +30 🌟</div>
    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchAuthTab('login')">Вход</div>
      <div class="tab" id="tab-register" onclick="switchAuthTab('register')">Регистрация</div>
    </div>
    <div class="input-group"><label>Логин</label><input type="text" id="authLogin" placeholder="Ваш логин"></div>
    <div class="input-group"><label>Пароль</label><input type="password" id="authPassword" placeholder="Пароль (мин. 6 символов)"></div>
    <button class="btn-main" id="loginBtn" onclick="handleAuth()">Войти</button>
  </div>
</div>
<div id="mainScreen">
  <header>
    <div class="logo">Кейсы</div>
    <div class="user-info">👤 <span id="uiUsername"></span></div>
    <div class="balance-top"><span id="uiBalanceTop">0</span> 🌟</div>
  </header>
  <div class="tabs-nav">
    <button class="nav-btn active" onclick="switchTab('cases', this)">Кейсы</button>
    <button class="nav-btn" onclick="switchTab('inventory', this)">Инвентарь</button>
    <button class="nav-btn" id="adminTabBtn" onclick="switchTab('admin', this)" style="display:none; background:#ef4444; border-color:#ef4444; color:#fff;">Админка</button>
    <button class="nav-btn" onclick="logout()" style="margin-left:auto; color:#ef4444;">Выйти</button>
  </div>
  <div id="section-cases" class="content-section active"><div class="cases" id="cases"></div></div>
  <div id="section-inventory" class="content-section"><div class="inventory" id="inventory"></div></div>
  <div id="section-admin" class="content-section" style="text-align: center;">
    <h2>Панель Администратора</h2>
    <div class="admin-box">
      <h3 style="margin-bottom:10px;">Выдать звезды</h3>
      <input type="text" id="adminTarget" placeholder="Логин игрока">
      <input type="number" id="adminAmount" placeholder="Сумма" value="1000">
      <button onclick="adminGiveStars()" style="background:#10b981; color:#fff;">Выдать звезды</button>
    </div>
    <div class="admin-box" id="superAdminBox" style="display: none; border: 1px solid #ef4444;">
      <h3 style="margin-bottom:10px; color:#ef4444;">Управление Админами</h3>
      <input type="text" id="newAdminLogin" placeholder="Логин нового админа">
      <button onclick="makeAdmin()" style="background:#a855f7; color:#fff;">Назначить Админом</button>
      <button onclick="removeAdmin()" style="background:#374151; color:#fff;">Снять права</button>
    </div>
  </div>
</div>
<div class="modal" id="resultModal">
  <div class="box">
    <div style="color:#aaa; font-size:14px; text-transform:uppercase; letter-spacing:1px;">Вы получили</div>
    <div class="icon" id="modalIcon">?</div>
    <div class="result-name" id="modalName"></div>
    <div class="rarity" id="modalRarity" style="font-weight:bold; font-size:14px; letter-spacing:1px;"></div>
    <button onclick="closeResultModal()">Забрать в инвентарь</button>
  </div>
</div>
<div class="modal" id="previewModal">
  <div class="box">
    <h2 id="prevCaseName" style="margin-bottom:5px;">Название</h2>
    <p style="color:#888; font-size:14px;">Возможные предметы:</p>
    <div class="case-items-grid" id="previewGrid"></div>
    <button id="openCaseBtn">Открыть кейс</button>
    <button class="close-btn" onclick="closePreviewModal()">Закрыть</button>
  </div>
</div>
<script>
let currentUser = null, authMode = 'login';
let playerData = { balance: 0, inventory: [] };
let isSuperAdmin = false;
const RARITIES = {'common':{name:'Обычный',color:'#9ca3af'},'nft':{name:'NFT',color:'#10b981'},'rare':{name:'Редкий',color:'#3b82f6'},'legendary':{name:'Легендарный',color:'#f59e0b'}};
const NFT_POOL = [
  { id: 'bear', name: 'Мишка', icon: '🧸', rarity: 'common', price: 15 }, { id: 'gift', name: 'Подарок', icon: '🎁', rarity: 'common', price: 25 },
  { id: 'heart', name: 'Сердечко', icon: '💖', rarity: 'common', price: 15 }, { id: 'rose', name: 'Роза', icon: '🌹', rarity: 'common', price: 25 },
  { id: 'cake', name: 'Торт', icon: '🎂', rarity: 'common', price: 50 }, { id: 'bouquet', name: 'Букет', icon: '💐', rarity: 'common', price: 50 },
  { id: 'rocket', name: 'Ракета', icon: '🚀', rarity: 'common', price: 50 }, { id: 'cup', name: 'Кубок', icon: '🏆', rarity: 'common', price: 100 },
  { id: 'ring', name: 'Кольцо', icon: '💍', rarity: 'common', price: 100 }, { id: 'diamond', name: 'Алмаз', icon: '💎', rarity: 'common', price: 100 },
  { id: 'skull', name: 'Череп', icon: '💀', rarity: 'nft', price: 50 }, { id: 'roses_bouquet', name: 'Розы', icon: '🌺', rarity: 'nft', price: 50 }, 
  { id: 'cigarette', name: 'Сигарета', icon: '🚬', rarity: 'rare', price: 500 }, { id: 'cigar', name: 'Сигара', icon: '🚬', rarity: 'rare', price: 800 },
  { id: 'socks', name: 'Носки', icon: '🧦', rarity: 'rare', price: 1000 }, { id: 'music_box', name: 'Шкатулка', icon: '🎵', rarity: 'rare', price: 1000 },
  { id: 'potion', name: 'Зелье', icon: '🧪', rarity: 'rare', price: 1000 }, { id: 'calendar', name: 'Календарь', icon: '📅', rarity: 'rare', price: 1500 },
  { id: 'button', name: 'Кнопка', icon: '🔘', rarity: 'rare', price: 500 }, { id: 'cap', name: 'Кепка', icon: '🧢', rarity: 'legendary', price: 10000 },
  { id: 'car', name: 'Машина', icon: '🚗', rarity: 'legendary', price: 5000 }, { id: 'pepe', name: 'Плюш Пепе', icon: '🐸', rarity: 'legendary', price: 50000 },
];
const CASES = [
  { id: 'starter', name: 'Стартовый', icon: '📦', price: 50, desc: 'Только до NFT' },
  { id: 'pro', name: 'Про', icon: '🎁', price: 500, desc: 'Обычные и Редкие' },
  { id: 'elite', name: 'Элитный', icon: '💎', price: 8000, desc: 'Всё, включая Легендарки' },
];

// --- ФУНКЦИИ АВТОРИЗАЦИИ ---
function switchAuthTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-register').classList.toggle('active', mode === 'register');
}

async function handleAuth() {
  const login = document.getElementById('authLogin').value.trim();
  const pass = document.getElementById('authPassword').value;
  if (!login) return alert('Введите логин!');
  if (pass.length < 6) return alert('Пароль минимум 6 символов!');
  
  const endpoint = authMode === 'register' ? '/api/register' : '/api/login';
  try {
    const response = await fetch(endpoint, { 
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' }, 
      body: JSON.stringify({ login, password: pass }) 
    });
    const result = await response.json();
    if (!response.ok) return alert(result.error || 'Ошибка!');
    
    currentUser = login;
    if (authMode === 'register') alert('Регистрация успешна! Вам начислено 30 🌟');
    enterGame();
  } catch (e) { 
    alert('Ошибка сети. Сервер недоступен.'); 
  }
}

async function enterGame() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('uiUsername').textContent = currentUser;
  localStorage.setItem('saved_user', currentUser);
  
  const response = await fetch('/api/user/' + currentUser);
  if (response.ok) {
    const data = await response.json();
    isSuperAdmin = data.is_super_admin;
    if (data.is_admin) {
      document.getElementById('adminTabBtn').style.display = 'block';
      document.getElementById('superAdminBox').style.display = data.is_super_admin ? 'block' : 'none';
    } else {
      document.getElementById('adminTabBtn').style.display = 'none';
    }
  }
  loadPlayerData();
}

function logout() {
  currentUser = null; isSuperAdmin = false;
  localStorage.removeItem('saved_user');
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('authPassword').value = '';
}

// --- ОСТАЛЬНАЯ ЛОГИКА ---
async function loadPlayerData() { if (!currentUser) return; try { const response = await fetch('/api/user/' + currentUser); if (response.ok) { playerData = await response.json(); updateUI(); } } catch (e) { console.log(e); } }
function updateUI() { document.getElementById('uiBalanceTop').textContent = playerData.balance; renderInventory(); }
function switchTab(tabId, btn) { document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active')); document.getElementById('section-' + tabId).classList.add('active'); btn.classList.add('active'); }

function openPreview(caseObj) {
  document.getElementById('prevCaseName').textContent = caseObj.icon + ' ' + caseObj.name;
  document.getElementById('openCaseBtn').textContent = 'Открыть за ' + caseObj.price + ' 🌟';
  document.getElementById('openCaseBtn').onclick = () => startOpening(caseObj);
  const grid = document.getElementById('previewGrid'); grid.innerHTML = '';
  let previewPool = NFT_POOL;
  if (caseObj.id === 'starter') previewPool = NFT_POOL.filter(i => ['common', 'nft'].includes(i.rarity));
  else if (caseObj.id === 'pro') previewPool = NFT_POOL.filter(i => ['common', 'rare'].includes(i.rarity));
  const sortedPool = [...previewPool].sort((a, b) => { const order = { 'legendary': 1, 'rare': 2, 'nft': 3, 'common': 4 }; return order[a.rarity] - order[b.rarity]; });
  sortedPool.forEach(item => { const rInfo = RARITIES[item.rarity]; const div = document.createElement('div'); div.className = 'case-item-preview'; div.style.borderColor = rInfo.color; div.innerHTML = '<div class="c-icon">' + item.icon + '</div><div class="c-name">' + item.name + '</div><div class="c-rarity" style="color:' + rInfo.color + '">' + rInfo.name + '</div>'; grid.appendChild(div); });
  document.getElementById('previewModal').classList.add('show');
}

function closePreviewModal() { document.getElementById('previewModal').classList.remove('show'); }

async function startOpening(caseObj) {
  if (playerData.balance < caseObj.price) return alert('Недостаточно средств!');
  const nft = getRandomItem(caseObj.id); const rInfo = RARITIES[nft.rarity]; closePreviewModal();
  document.getElementById('modalIcon').textContent = nft.icon; document.getElementById('modalName').textContent = nft.name;
  document.getElementById('modalRarity').textContent = rInfo.name; document.getElementById('modalRarity').style.color = rInfo.color;
  document.getElementById('resultModal').classList.add('show');
  await fetch('/api/inventory/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login: currentUser, itemId: nft.id, name: nft.name, icon: nft.icon, rarity: nft.rarity, price: nft.price }) });
  await loadPlayerData();
}

function getRandomItem(caseId) { let pool = NFT_POOL; if (caseId === 'starter') pool = NFT_POOL.filter(i => ['common', 'nft'].includes(i.rarity)); if (caseId === 'pro') pool = NFT_POOL.filter(i => ['common', 'rare'].includes(i.rarity)); return pool[Math.floor(Math.random() * pool.length)]; }
function closeResultModal() { document.getElementById('resultModal').classList.remove('show'); }

async function sellItem(uid, price) { if (confirm('Продать за ' + price + ' 🌟?')) { await fetch('/api/inventory/sell', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login: currentUser, uid, price }) }); await loadPlayerData(); } }

async function adminGiveStars() { const target = document.getElementById('adminTarget').value.trim(); const amount = parseInt(document.getElementById('adminAmount').value); if (!target || !amount) return alert('Заполните поля!'); const response = await fetch('/api/admin/give-stars', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ adminLogin: currentUser, targetLogin: target, amount: amount }) }); const result = await response.json(); if (response.ok) alert('Успешно выдано ' + amount + ' 🌟 игроку ' + target + '!'); else alert(result.error); }
async function makeAdmin() { const target = document.getElementById('newAdminLogin').value.trim(); if (!target) return alert('Введите логин!'); const response = await fetch('/api/admin/make-admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ superAdminLogin: currentUser, targetLogin: target }) }); const result = await response.json(); if (response.ok) alert('Игрок ' + target + ' теперь Админ!'); else alert(result.error); }
async function removeAdmin() { const target = document.getElementById('newAdminLogin').value.trim(); if (!target) return alert('Введите логин!'); const response = await fetch('/api/admin/remove-admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ superAdminLogin: currentUser, targetLogin: target }) }); const result = await response.json(); if (response.ok) alert('С игрока ' + target + ' сняты права Админа!'); else alert(result.error); }

function renderCases() { const el = document.getElementById('cases'); el.innerHTML = ''; CASES.forEach(c => { const div = document.createElement('div'); div.className = 'case'; div.innerHTML = '<div class="icon">' + c.icon + '</div><div class="name">' + c.name + '</div><div class="price">' + c.price + ' 🌟</div><div class="desc">' + c.desc + '</div>'; div.onclick = () => openPreview(c); el.appendChild(div); }); }

function renderInventory() { const el = document.getElementById('inventory'); if (!playerData.inventory || playerData.inventory.length === 0) { el.innerHTML = '<div style="color:#555; text-align:center; padding:20px; grid-column: 1/-1;">Пусто</div>'; return; } el.innerHTML = ''; playerData.inventory.forEach(item => { const rInfo = RARITIES[item.rarity]; const div = document.createElement('div'); div.className = 'item'; div.innerHTML = '<div class="icon">' + item.icon + '</div><div class="name">' + item.name + '</div><div style="font-size:11px; font-weight:bold; color:' + rInfo.color + '; margin-bottom:8px;">' + rInfo.name + '</div><button onclick="sellItem(\'' + item.uid +
