<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кейсы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e2e2e2; min-height: 100vh; padding: 20px; overflow-x: hidden; }
  
  /* Экраны входа */
  #authScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
  .auth-box { background: #16162a; border: 1px solid #2a2a4a; border-radius: 24px; padding: 40px; width: 100%; max-width: 420px; }
  .auth-box h1 { font-size: 32px; text-align: center; color: #a855f7; margin-bottom: 10px; }
  .auth-box .subtitle { color: #888; font-size: 14px; text-align: center; margin-bottom: 25px; }
  .tabs { display: flex; background: #12121a; border-radius: 12px; padding: 4px; margin-bottom: 25px; }
  .tab { flex: 1; padding: 12px; text-align: center; border-radius: 8px; cursor: pointer; font-weight: 600; color: #888; user-select: none; }
  .tab.active { background: #1a1a2e; color: #fff; }
  .input-group { margin-bottom: 18px; }
  .input-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #aaa; }
  .input-group input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #2a2a4a; background: #12121a; color: #fff; font-size: 15px; outline: none; }
  .btn-main { width: 100%; padding: 16px; border: none; border-radius: 12px; background: #a855f7; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
  .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }
  
  /* Главный экран */
  #mainScreen { display: none; max-width: 1000px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; background: #16162a; padding: 15px 25px; border-radius: 16px; margin-bottom: 25px; }
  .logo { font-size: 24px; font-weight: 800; color: #a855f7; }
  .user-info { font-weight: 600; color: #ccc; }
  .balance-top { background: #12121a; padding: 8px 16px; border-radius: 20px; font-weight: bold; color: #ffd700; cursor: pointer; }
  
  .tabs-nav { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
  .nav-btn { padding: 12px 24px; background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; color: #888; cursor: pointer; font-weight: 600; transition: 0.2s; }
  .nav-btn.active { background: #a855f7; border-color: #a855f7; color: #fff; }
  
  .content-section { display: none; }
  .content-section.active { display: block; }

  /* Профиль */
  .profile-box { background: #16162a; border-radius: 16px; padding: 25px; text-align: center; margin-bottom: 20px; border: 1px solid #2a2a4a; }
  .profile-avatar { font-size: 80px; margin-bottom: 10px; }
  .profile-name { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 15px; }
  .profile-stats { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
  .stat-box { background: #12121a; padding: 15px 25px; border-radius: 12px; flex: 1; min-width: 120px; }
  .stat-value { font-size: 20px; font-weight: bold; color: #ffd700; }
  .stat-label { font-size: 12px; color: #888; margin-top: 5px; }
  
  /* Кейсы и Инвентарь */
  .cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .case { background: #16162a; border: 1px solid #2a2a4a; border-radius: 16px; padding: 25px 20px; text-align: center; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
  .case:hover { border-color: #a855f7; transform: translateY(-5px); }
  .case .icon { font-size: 50px; margin-bottom: 15px; }
  .case .name { font-weight: 700; font-size: 18px; color: #fff; }
  .case .desc { font-size: 12px; color: #888; margin: 5px 0 10px; }
  .case .price { color: #ffd700; font-size: 15px; font-weight: bold; }

  .inventory { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; }
  .item { background: #16162a; border: 1px solid #2a2a4a; border-radius: 14px; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
  .item .icon { font-size: 40px; }
  .item .name { font-size: 14px; font-weight: 600; color: #fff; margin: 5px 0; }
  .item button { width: 100%; padding: 8px; border: none; border-radius: 8px; color: #fff; cursor: pointer; margin-top: 5px; font-weight: bold; font-size: 12px; }
  .btn-sell { background: #f59e0b; }
  .btn-withdraw { background: #3b82f6; }
  .btn-sell-all { background: #ef4444; width: 100%; padding: 15px; margin-bottom: 20px; border: none; border-radius: 12px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; display: none; }

  /* Апгрейд */
  .upgrade-container { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; background: #16162a; padding: 30px; border-radius: 16px; border: 1px solid #2a2a4a; }
  .upgrade-slot { width: 150px; height: 180px; border: 2px dashed #444; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: #12121a; transition: 0.2s; }
  .upgrade-slot:hover { border-color: #a855f7; }
  .upgrade-slot .icon { font-size: 50px; }
  .upgrade-slot .name { font-size: 14px; color: #ccc; margin-top: 10px; }
  .upgrade-arrow { font-size: 30px; color: #a855f7; }
  .upgrade-btn { background: #a855f7; color: #fff; border: none; padding: 15px 40px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; width: 100%; max-width: 300px; }

  /* Модалки */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal.show { display: flex; }
  .modal .box { background: #16162a; border-radius: 20px; padding: 30px; text-align: center; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
  
  .case-items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; text-align: left; }
  .case-item-preview { background: #0a0a0f; border: 1px solid #2a2a4a; border-radius: 10px; padding: 10px; text-align: center; }

  /* Админка */
  .admin-box { background: #16162a; padding: 20px; border-radius: 16px; max-width: 900px; margin: 20px auto; text-align: left; }
  .admin-box input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: none; background: #0a0a0f; color: #fff; }
  .admin-box button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px; color: #fff; }

  /* Анимации */
  #animationModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; z-index: 200; flex-direction: column; overflow: hidden; }
  #animationModal.show { display: flex; }
  .roulette-container { width: 100%; max-width: 800px; height: 150px; background: #12121a; border-top: 2px solid #2a2a4a; border-bottom: 2px solid #2a2a4a; position: relative; overflow: hidden; display: flex; align-items: center; }
  .roulette-strip { display: flex; position: absolute; left: 0; }
  .roulette-item { width: 120px; height: 146px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid #2a2a4a; flex-shrink: 0; background: #16162a; }
  .roulette-item .r-icon { font-size: 50px; }
  .roulette-item .r-name { font-size: 10px; color: #aaa; margin-top: 5px; text-align: center; padding: 0 5px;}
  .roulette-pointer { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #ffd700; transform: translateX(-50%); z-index: 10; box-shadow: 0 0 15px #ffd700; }
  .win-overlay { display: none; text-align: center; margin-top: 30px; background: #16162a; padding: 20px 40px; border-radius: 16px; border: 2px solid #a855f7; box-shadow: 0 0 30px rgba(168,85,247,0.5);}
  .win-overlay.show { display: block; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <h1>Кейсы</h1>
    <div class="subtitle">Вход или регистрация. Бонус: +30 🌟</div>
    <div class="tabs">
      <div class="tab active" id="tab-login">Вход</div>
      <div class="tab" id="tab-register">Регистрация</div>
    </div>
    <div class="input-group"><label>Логин</label><input type="text" id="authLogin" placeholder="Ваш логин"></div>
    <div class="input-group"><label>Пароль</label><input type="password" id="authPassword" placeholder="Пароль (мин. 6 символов)"></div>
    <button type="button" class="btn-main" id="mainAuthBtn">Войти</button>
  </div>
</div>

<div id="mainScreen">
  <header>
    <div class="logo">Кейсы</div>
    <div class="user-info">👤 <span id="uiUsername"></span></div>
    <div class="balance-top" id="openPromoBtn"><span id="uiBalanceTop">0</span> 🌟</div>
  </header>
  <div class="tabs-nav">
    <button type="button" class="nav-btn active" id="navProfileBtn">Профиль</button>
    <button type="button" class="nav-btn" id="navCasesBtn">Кейсы</button>
    <button type="button" class="nav-btn" id="navInvBtn">Инвентарь</button>
    <button type="button" class="nav-btn" id="navUpgradeBtn">Апгрейд</button>
    <button type="button" class="nav-btn" id="adminTabBtn" style="display:none; background:#ef4444; border-color:#ef4444; color:#fff;">Админка</button>
    <button type="button" class="nav-btn" id="logoutBtn" style="margin-left:auto; color:#ef4444;">Выйти</button>
  </div>
  
  <!-- Профиль -->
  <div id="section-profile" class="content-section active">
    <div class="profile-box">
      <div class="profile-avatar">👤</div>
      <div class="profile-name" id="profileName">Игрок</div>
      <div class="profile-stats">
        <div class="stat-box">
          <div class="stat-value" id="profileBalance">0 🌟</div>
          <div class="stat-label">Баланс</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="profileNftCount">0</div>
          <div class="stat-label">Предметов</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="profileNftValue">0 🌟</div>
          <div class="stat-label">Стоимость NFT</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Кейсы -->
  <div id="section-cases" class="content-section"><div class="cases" id="cases"></div></div>

  <!-- Инвентарь -->
  <div id="section-inventory" class="content-section">
    <button type="button" class="btn-sell-all" id="btnSellAll">Продать всё</button>
    <div class="inventory" id="inventory"></div>
  </div>

  <!-- Апгрейд -->
  <div id="section-upgrade" class="content-section">
    <div class="upgrade-container">
      <div class="upgrade-slot" id="upgradeMySlot">
        <div class="icon">?</div><div class="name">Ваш NFT</div>
      </div>
      <div class="upgrade-arrow">➜</div>
      <div class="upgrade-slot" id="upgradeTargetSlot">
        <div class="icon">?</div><div class="name">Выберите NFT</div>
      </div>
    </div>
    <div style="text-align: center;">
      <button type="button" class="upgrade-btn" id="btnDoUpgrade">Улучшить (Шанс 50%)</button>
    </div>
  </div>

  <!-- Админка (вставим позже) -->
  <div id="section-admin" class="content-section" style="text-align: center;">
    <h2>Панель Администратора</h2>
    <div id="adminContent"></div>
  </div>
</div><script>
var currentUser = null;
var authMode = 'login';
var playerData = { balance: 0, inventory: [], stats: { totalItems: 0, totalValue: 0 } };
var isSuperAdmin = false;
var isOpening = false;
var sellingItems = {};
var selectedUpgradeItem = null;

// Серверные кейсы (для отрисовки витрины)
var CASES = [
  { id: 'starter', name: 'Стартовый', icon: '📦', price: 50, desc: 'Шанс на NFT' },
  { id: 'pro', name: 'Про', icon: '🎁', price: 500, desc: 'Обычные и Редкие' },
  { id: 'elite', name: 'Элитный', icon: '💎', price: 8000, desc: 'Шанс на Легендарку' }
];

// ==========================================
// АВТОРИЗАЦИЯ
// ==========================================
function switchAuthTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-register').classList.toggle('active', mode === 'register');
  document.getElementById('mainAuthBtn').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
}

async function handleAuth() {
  var login = document.getElementById('authLogin').value.trim();
  var pass = document.getElementById('authPassword').value;
  if (!login) return alert('Введите логин!');
  if (pass.length < 6) return alert('Пароль минимум 6 символов!');
  
  var btn = document.getElementById('mainAuthBtn');
  btn.disabled = true;

  var url = authMode === 'register' ? '/api/register' : '/api/login';
  try {
    var res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: login, password: pass })
    });
    var data = await res.json();
    if (!res.ok) {
      alert(data.error || 'Ошибка сервера');
      btn.disabled = false;
      return;
    }
    
    currentUser = login;
    if (authMode === 'register') alert('Успешно! +30 🌟');
    enterGame();
  } catch (e) {
    alert('Нет связи с сервером: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function enterGame() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  document.getElementById('uiUsername').textContent = currentUser;
  document.getElementById('profileName').textContent = currentUser;
  localStorage.setItem('saved_user', currentUser);
  renderCases();
  
  try {
    var res = await fetch('/api/user/' + encodeURIComponent(currentUser));
    if (res.ok) {
      var data = await res.json();
      isSuperAdmin = data.is_super_admin;
      if (data.is_admin) {
        document.getElementById('adminTabBtn').style.display = 'block';
      } else {
        document.getElementById('adminTabBtn').style.display = 'none';
      }
      playerData = data;
      updateUI();
    }
  } catch (e) {}
}

function logout() {
  currentUser = null;
  isSuperAdmin = false;
  localStorage.removeItem('saved_user');
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('authPassword').value = '';
}

async function loadPlayerData() {
  if (!currentUser) return;
  try {
    var res = await fetch('/api/user/' + encodeURIComponent(currentUser));
    if (res.ok) {
      playerData = await res.json();
      updateUI();
    }
  } catch (e) {}
}

function updateUI() {
  document.getElementById('uiBalanceTop').textContent = playerData.balance;
  document.getElementById('profileBalance').textContent = playerData.balance + ' 🌟';
  
  if (playerData.stats) {
    document.getElementById('profileNftCount').textContent = playerData.stats.totalItems;
    document.getElementById('profileNftValue').textContent = playerData.stats.totalValue + ' 🌟';
  }
  renderInventory();
}

// ==========================================
// НАВИГАЦИЯ
// ==========================================
function switchTab(id, btn) {
  document.querySelectorAll('.content-section').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('section-' + id).classList.add('active');
  if (btn) btn.classList.add('active');
  if (id === 'admin') loadAdminPlayers();
  if (id === 'upgrade') renderUpgradeTab();
  if (id === 'inventory') updateSellAllButton();
}

function renderCases() {
  var container = document.getElementById('cases');
  container.innerHTML = '';
  CASES.forEach(function(c) {
    var div = document.createElement('div');
    div.className = 'case';
    div.onclick = function() { openPreview(c); };
    div.innerHTML = '<div class="icon">' + c.icon + '</div><div class="name">' + c.name + '</div><div class="desc">' + c.desc + '</div><div class="price">' + c.price + ' 🌟</div>';
    container.appendChild(div);
  });
}

function renderInventory() {
  var container = document.getElementById('inventory');
  container.innerHTML = '';
  if (!playerData.inventory || playerData.inventory.length === 0) {
    container.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 30px;">Инвентарь пуст</div>';
    updateSellAllButton();
    return;
  }
  
  playerData.inventory.forEach(function(item) {
    var div = document.createElement('div');
    div.className = 'item';
    var rColor = {'common': '#9ca3af', 'nft': '#10b981', 'rare': '#3b82f6', 'legendary': '#f59e0b'}[item.rarity] || '#fff';
    div.style.borderColor = rColor;
    
    div.innerHTML = '<div class="icon">' + item.icon + '</div><div class="name">' + item.name + '</div><div style="font-size:11px; color:' + rColor + '; margin-bottom:6px;">' + item.price + ' 🌟</div>';
    
    var btnSell = document.createElement('button');
    btnSell.className = 'btn-sell';
    btnSell.textContent = 'Продать';
    btnSell.onclick = function() { sellItem(item.uid, item.price, btnSell); };
    
    var btnWithdraw = document.createElement('button');
    btnWithdraw.className = 'btn-withdraw';
    btnWithdraw.textContent = 'На вывод';
    btnWithdraw.onclick = function() { withdrawItem(item.uid, item.name, btnWithdraw); };
    
    div.appendChild(btnSell);
    div.appendChild(btnWithdraw);
    container.appendChild(div);
  });
  updateSellAllButton();
}

// ==========================================
// КЕЙСЫ (БЕЗОПАСНЫЕ)
// ==========================================
function openPreview(c) {
  document.getElementById('prevCaseName').textContent = c.icon + ' ' + c.name;
  var openBtn = document.getElementById('openCaseBtn');
  openBtn.textContent = 'Открыть за ' + c.price + ' 🌟';
  openBtn.disabled = false;
  openBtn.onclick = function() { startOpening(c); };
  document.getElementById('previewModal').classList.add('show');
}

async function startOpening(c) {
  if (isOpening) return;
  if (playerData.balance < c.price) return alert('Мало звезд!');

  isOpening = true;
  var openBtn = document.getElementById('openCaseBtn');
  openBtn.disabled = true;

  try {
    // Сервер сам решает, что выпало
    var res = await fetch('/api/cases/open', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: currentUser, caseId: c.id })
    });

    var data = await res.json();
    if (!res.ok) {
      alert(data.error || 'Ошибка открытия');
      isOpening = false;
      openBtn.disabled = false;
      return;
    }

    playerData.balance = data.balance;
    document.getElementById('uiBalanceTop').textContent = playerData.balance;

    document.getElementById('previewModal').classList.remove('show');
    document.getElementById('animationModal').classList.add('show');
    document.getElementById('winOverlay').classList.remove('show');

    // Генерируем ленту из пула, который прислал сервер
    var stripHtml = '';
    var stripItems = [];
    for (var i = 0; i < 50; i++) {
      var randItem = data.pool[Math.floor(Math.random() * data.pool.length)];
      stripItems.push(randItem);
    }
    // Вставляем выигранный предмет на 45-ю позицию
    stripItems.splice(45, 1, data.item);

    stripItems.forEach(function(item) {
      stripHtml += '<div class="roulette-item"><div class="r-icon">' + item.icon + '</div><div class="r-name">' + item.name + '</div></div>';
    });

    var strip = document.getElementById('rouletteStrip');
    strip.innerHTML = stripHtml;
    strip.style.transition = 'none';
    strip.style.transform = 'translateX(0)';

    setTimeout(function() {
      var itemWidth = 121;
      var containerWidth = document.querySelector('.roulette-container').offsetWidth;
      var centerOffset = (containerWidth / 2) - (itemWidth / 2);
      var targetPosition = (45 * itemWidth) - centerOffset;
      strip.style.transition = 'transform 5s cubic-bezier(0.1, 0.7, 0.1, 1)';
      strip.style.transform = 'translateX(-' + targetPosition + 'px)';
    }, 100);

    setTimeout(async function() {
      await loadPlayerData();
      document.getElementById('winIcon').textContent = data.item.icon;
      document.getElementById('winName').textContent = data.item.name;
      var rEl = document.getElementById('winRarity');
      rEl.textContent = data.item.rarity.toUpperCase();
      rEl.style.color = {'common': '#9ca3af', 'nft': '#10b981', 'rare': '#3b82f6', 'legendary': '#f59e0b'}[data.item.rarity] || '#fff';
      
      // Показываем кнопки "Забрать" и "Продать"
      document.getElementById('winButtons').style.display = 'flex';
      document.getElementById('btnSellWonItem').onclick = function() {
        closeAnimation();
        sellItem(data.item.uid, data.item.price, null); // Продаем
      };
      
      document.getElementById('winOverlay').classList.add('show');
      isOpening = false;
      openBtn.disabled = false;
    }, 5100);
  } catch (e) {
    alert('Ошибка сети');
    isOpening = false;
    openBtn.disabled = false;
  }
}

function closeAnimation() {
  document.getElementById('animationModal').classList.remove('show');
  document.getElementById('winOverlay').classList.remove('show');
}

// ==========================================
// ПРОДАЖА И ВЫВОД
// ==========================================
async function sellItem(uid, price, btn) {
  if (sellingItems[uid]) return;
  sellingItems[uid] = true;
  if (btn) { btn.disabled = true; btn.textContent = '...'; }

  try {
    if (!confirm('Продать за ' + price + ' 🌟?')) {
      if (btn) { btn.disabled = false; btn.textContent = 'Продать'; }
      return;
    }

    var res = await fetch('/api/inventory/sell', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: currentUser, uid: uid })
    });

    var data = await res.json();
    if (!res.ok) { alert(data.error || 'Ошибка'); await loadPlayerData(); return; }

    if (typeof data.balance === 'number') {
      playerData.balance = data.balance;
      document.getElementById('uiBalanceTop').textContent = playerData.balance;
    }
    await loadPlayerData();
  } finally {
    delete sellingItems[uid];
  }
}

async function withdrawItem(uid, name, btn) {
  if (!confirm('Вывести "' + name + '" на проверку?')) return;
  btn.disabled = true;
  try {
    var res = await fetch('/api/inventory/withdraw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: currentUser, uid: uid })
    });
    if (res.ok) {
      alert('Заявка на вывод создана! Ожидайте проверки админом.');
      await loadPlayerData();
    } else {
      alert('Ошибка вывода');
      btn.disabled = false;
    }
  } catch (e) { btn.disabled = false; }
}

async function sellAllItems() {
  if (!playerData.inventory || playerData.inventory.length === 0) return;
  if (!confirm('Вы уверены, что хотите продать ВСЁ?')) return;
  
  var res = await fetch('/api/inventory/sell-all', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ login: currentUser })
  });
  var data = await res.json();
  if (res.ok) {
    alert('Выручено: ' + data.earned + ' 🌟');
    await loadPlayerData();
  } else {
    alert(data.error);
  }
}

function updateSellAllButton() {
  var btn = document.getElementById('btnSellAll');
  if (btn) btn.style.display = (playerData.inventory && playerData.inventory.length > 0) ? 'block' : 'none';
}<!-- Скрытые модалки и элементы (добавляем в конец body) -->
<div class="modal" id="previewModal">
  <div class="box">
    <h2 id="prevCaseName" style="margin-bottom:15px;">Название</h2>
    <div class="case-items-grid" id="previewGrid"></div>
    <button type="button" id="openCaseBtn" style="margin-top:20px; padding:14px; width:100%; background:#a855f7; color:#fff; border:none; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer;">Открыть кейс</button>
    <button type="button" id="closePreviewBtn" style="background:transparent; border:1px solid #444; color:#aaa; margin-top:10px; padding:10px; width:100%; border-radius:10px; cursor:pointer;">Закрыть</button>
  </div>
</div>

<div class="modal" id="promoModal">
  <div class="box">
    <h2 style="margin-bottom:15px;">Ввести промокод</h2>
    <input type="text" id="promoInput" placeholder="Введите код" style="width:100%; padding:14px; border-radius:10px; border:1px solid #2a2a4a; background:#12121a; color:#fff; margin-bottom:15px; text-transform: uppercase;">
    <button type="button" id="btnActivatePromo" style="margin-bottom:10px; padding:14px; width:100%; background:#3b82f6; color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Активировать</button>
    <button type="button" id="closePromoBtn" style="background:transparent; border:1px solid #444; color:#aaa; padding:10px; width:100%; border-radius:10px; cursor:pointer;">Закрыть</button>
  </div>
</div>

<div id="animationModal">
  <div class="roulette-container">
    <div class="roulette-pointer"></div>
    <div class="roulette-strip" id="rouletteStrip"></div>
  </div>
  <div class="win-overlay" id="winOverlay">
    <div style="font-size: 60px;" id="winIcon">?</div>
    <h2 style="color: #fff; margin: 10px 0;" id="winName"></h2>
    <div id="winRarity" style="font-weight: bold; margin-bottom: 15px;"></div>
    <div id="winButtons" style="display: flex; gap: 10px; justify-content: center;">
      <button type="button" class="btn-main" id="closeAnimBtn" style="padding: 12px 20px; font-size: 14px; background:#10b981;">Забрать</button>
      <button type="button" class="btn-main" id="btnSellWonItem" style="padding: 12px 20px; font-size: 14px; background:#f59e0b;">Продать</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// АПГРЕЙД
// ==========================================
var upgradeSelectedMine = null;
var upgradeSelectedTarget = null;

function renderUpgradeTab() {
  document.getElementById('upgradeMySlot').onclick = function() {
    if (!playerData.inventory || playerData.inventory.length === 0) return alert('Инвентарь пуст');
    var itemsList = playerData.inventory.map(i => `${i.name} (${i.price}🌟)`).join('\n');
    var choice = prompt('Введите точное название предмета:\n' + itemsList);
    if (!choice) return;
    var found = playerData.inventory.find(i => i.name.toLowerCase() === choice.toLowerCase());
    if (found) {
      upgradeSelectedMine = found;
      updateUpgradeUI();
    } else {
      alert('Предмет не найден');
    }
  };

  document.getElementById('upgradeTargetSlot').onclick = function() {
    var targetId = prompt('Введите ID предмета, на который хотите улучшить (например, pepe, car):');
    if (!targetId) return;
    var pool = { 'pepe': { name: 'Плюш Пепе', icon: '🐸', price: 50000 }, 'car': { name: 'Машина', icon: '🚗', price: 5000 }, 'calendar': { name: 'Календарь', icon: '📅', price: 1500 } };
    var found = pool[targetId.toLowerCase()];
    if (found) {
      upgradeSelectedTarget = { ...found, id: targetId.toLowerCase() };
      updateUpgradeUI();
    } else {
      alert('Такой предмет не найден в базе апгрейда');
    }
  };
}

function updateUpgradeUI() {
  if (upgradeSelectedMine) {
    document.getElementById('upgradeMySlot').innerHTML = '<div class="icon">' + upgradeSelectedMine.icon + '</div><div class="name">' + upgradeSelectedMine.name + '</div><div style="font-size:10px;color:#888;">' + upgradeSelectedMine.price + '🌟</div>';
  }
  if (upgradeSelectedTarget) {
    document.getElementById('upgradeTargetSlot').innerHTML = '<div class="icon">' + upgradeSelectedTarget.icon + '</div><div class="name">' + upgradeSelectedTarget.name + '</div><div style="font-size:10px;color:#888;">' + upgradeSelectedTarget.price + '🌟</div>';
  }
}

async function doUpgrade() {
  if (!upgradeSelectedMine || !upgradeSelectedTarget) return alert('Выберите оба предмета');
  if (upgradeSelectedMine.price >= upgradeSelectedTarget.price) return alert('Целевой предмет должен быть дороже!');

  var btn = document.getElementById('btnDoUpgrade');
  btn.disabled = true;
  btn.textContent = 'Крутим...';

  var res = await fetch('/api/upgrade', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ login: currentUser, myUid: upgradeSelectedMine.uid, targetItemId: upgradeSelectedTarget.id })
  });
  var data = await res.json();

  setTimeout(async () => {
    btn.disabled = false;
    btn.textContent = 'Улучшить (Шанс 50%)';
    upgradeSelectedMine = null;
    upgradeSelectedTarget = null;
    renderUpgradeTab();

    if (res.ok) {
      if (data.win) {
        alert('УСПЕХ! Вы получили ' + data.item.name);
      } else {
        alert('Неудача. Ваш предмет сгорел.');
      }
      await loadPlayerData();
    } else {
      alert(data.error);
    }
  }, 1000);
}

// ==========================================
// ПРОМОКОДЫ
// ==========================================
async function activatePromo() {
  var code = document.getElementById('promoInput').value.trim().toUpperCase();
  if (!code) return alert('Введите код');
  var res = await fetch('/api/promo/activate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ login: currentUser, code: code })
  });
  var data = await res.json();
  if (res.ok) {
    alert('Успешно! Вы получили ' + data.stars + ' 🌟');
    document.getElementById('promoModal').classList.remove('show');
    document.getElementById('promoInput').value = '';
    await loadPlayerData();
  } else {
    alert(data.error || 'Ошибка');
  }
}

// ==========================================
// АДМИНКА
// ==========================================
async function loadAdminPlayers() {
  const tbody = document.getElementById('adminPlayersTable');
  if (!tbody) return;
  const res = await fetch('/api/admin/players');
  if (!res.ok) return;
  const players = await res.json();
  tbody.innerHTML = '';
  players.forEach(p => {
    const tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid #333';
    tr.innerHTML = `
      <td style="padding: 10px;">${p.login}</td>
      <td>${p.balance} 🌟</td>
      <td>${p.nft_count} шт.</td>
      <td>
        <button onclick="quickAdmin('${p.login}', 'give')" style="background:#10b981; padding:4px 8px; border-radius:4px; border:none; color:#fff; cursor:pointer;">+1000</button>
        <button onclick="quickAdmin('${p.login}', 'take')" style="background:#ef4444; padding:4px 8px; border-radius:4px; border:none; color:#fff; cursor:pointer;">-1000</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function quickAdmin(login, action) {
  await fetch('/api/admin/' + (action === 'give' ? 'give-stars' : 'take-stars'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ adminLogin: currentUser, targetLogin: login, amount: 1000 })
  });
  loadAdminPlayers();
}

async function loadWithdraws() {
  const res = await fetch('/api/admin/withdraws');
  const data = await res.json();
  const container = document.getElementById('withdrawList');
  if (!container) return;
  if (data.length === 0) { container.innerHTML = '<div style="color:#888;">Нет заявок</div>'; return; }
  container.innerHTML = data.map(w => `
    <div style="background:#12121a; padding:10px; border-radius:8px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
      <span>👤 ${w.user_login} хочет вывести ${w.item_name} (${w.item_price}🌟)</span>
      <button onclick="acceptWithdraw(${w.id})" style="background:#10b981; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Выдать</button>
    </div>
  `).join('');
}

async function acceptWithdraw(id) {
  await fetch('/api/admin/withdraws/accept', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
  loadWithdraws();
}

async function adminGiveStars() {
  var t = document.getElementById('adminTarget').value.trim();
  var a = parseInt(document.getElementById('adminAmount').value, 10);
  if (!t || !a) return alert('Заполните поля');
  var res = await fetch('/api/admin/give-stars', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ adminLogin: currentUser, targetLogin: t, amount: a })
  });
  if (res.ok) { alert('Выдано'); loadAdminPlayers(); } else alert('Ошибка');
}

async function adminTakeStars() {
  var t = document.getElementById('adminTarget').value.trim();
  var a = parseInt(document.getElementById('adminAmount').value, 10);
  if (!t || !a) return alert('Заполните поля');
  var res = await fetch('/api/admin/take-stars', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ adminLogin: currentUser, targetLogin: t, amount: a })
  });
  if (res.ok) { alert('Списано'); loadAdminPlayers(); } else alert('Ошибка');
}

async function adminCreatePromo() {
  var code = document.getElementById('promoCode').value.trim();
  var stars = parseInt(document.getElementById('promoStars').value, 10);
  var limit = parseInt(document.getElementById('promoLimit').value, 10);
  if (!code || !stars || !limit) return alert('Заполните поля');
  var res = await fetch('/api/admin/create-promo', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ adminLogin: currentUser, code, stars, limit })
  });
  if (res.ok) alert('Промокод создан!'); else alert('Ошибка (возможно, код есть)');
}

// Рендер админки (вызывается при переходе на вкладку)
function renderAdminUI() {
  var container = document.getElementById('adminContent');
  if (container.innerHTML !== '') return; // Уже отрисовано
  container.innerHTML = `
    <div class="admin-box" style="max-width: 900px; overflow-x: auto;">
      <h3>Игроки</h3>
      <table style="width:100%; border-collapse:collapse; color:#fff;"><tbody id="adminPlayersTable"></tbody></table>
    </div>
    <div class="admin-box">
      <h3>Управление звездами</h3>
      <input type="text" id="adminTarget" placeholder="Логин">
      <input type="number" id="adminAmount" value="1000">
      <div style="display:flex; gap:10px;">
        <button id="btnAdminGive" style="background:#10b981; flex:1;">Выдать</button>
        <button id="btnAdminTake" style="background:#ef4444; flex:1;">Забрать</button>
      </div>
    </div>
    <div class="admin-box" style="border: 1px solid #3b82f6;">
      <h3 style="color:#3b82f6;">Заявки на вывод</h3>
      <div id="withdrawList"></div>
    </div>
    <div class="admin-box">
      <h3>Создать промокод</h3>
      <input type="text" id="promoCode" placeholder="Код">
      <input type="number" id="promoStars" placeholder="Звезды" value="100">
      <input type="number" id="promoLimit" placeholder="Активаций" value="10">
      <button id="btnCreatePromo" style="background:#a855f7;">Создать</button>
    </div>
  `;
  document.getElementById('btnAdminGive').onclick = adminGiveStars;
  document.getElementById('btnAdminTake').onclick = adminTakeStars;
  document.getElementById('btnCreatePromo').onclick = adminCreatePromo;
  loadAdminPlayers();
  loadWithdraws();
}

// ==========================================
// ИНИЦИАЛИЗАЦИЯ
// ==========================================
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('tab-login').addEventListener('click', function() { switchAuthTab('login'); });
  document.getElementById('tab-register').addEventListener('click', function() { switchAuthTab('register'); });
  document.getElementById('mainAuthBtn').addEventListener('click', handleAuth);
  
  document.getElementById('navProfileBtn').addEventListener('click', function() { switchTab('profile', this); });
  document.getElementById('navCasesBtn').addEventListener('click', function() { switchTab('cases', this); });
  document.getElementById('navInvBtn').addEventListener('click', function() { switchTab('inventory', this); });
  document.getElementById('navUpgradeBtn').addEventListener('click', function() { switchTab('upgrade', this); });
  document.getElementById('adminTabBtn').addEventListener('click', function() { switchTab('admin', this); renderAdminUI(); });
  document.getElementById('logoutBtn').addEventListener('click', logout);
  
  document.getElementById('btnSellAll').addEventListener('click', sellAllItems);
  document.getElementById('btnDoUpgrade').addEventListener('click', doUpgrade);
  document.getElementById('closePreviewBtn').addEventListener('click', function() { document.getElementById('previewModal').classList.remove('show'); });
  document.getElementById('closeAnimBtn').addEventListener('click', closeAnimation);

  document.getElementById('openPromoBtn').addEventListener('click', function() { document.getElementById('promoModal').classList.add('show'); });
  document.getElementById('closePromoBtn').addEventListener('click', function() { document.getElementById('promoModal').classList.remove('show'); });
  document.getElementById('btnActivatePromo').addEventListener('click', activatePromo);

  var saved = localStorage.getItem('saved_user');
  if (saved) { currentUser = saved; enterGame(); }
});
</script>
</body>
</html>
